# Render Blueprint · 纯静态作品集
# 静态站在 Blueprint 里是 type: web + runtime: static（不是 type: static）
# 无 buildCommand（纯静态零构建）、无 plan（Static Site 免费）
services:
  - type: web
    name: li-xiaoyang-portfolio
    runtime: static
    staticPublishPath: ./public
    headers:
      # 简历 PDF 体积较大且不常变，给一天缓存。
      # HTML / CSS / JS 保持默认协商缓存，避免发版后访客拿到旧页面。
      - path: /Li-Xiaoyang-AI-Engineer-Resume.pdf
        name: Cache-Control
        value: public, max-age=86400
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
